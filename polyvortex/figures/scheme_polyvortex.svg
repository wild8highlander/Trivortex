<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0A1A3A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="470" fill="#FFFFFF"/>
  <text x="470" y="30" text-anchor="middle" font-family="Liberation Sans, Arial" font-size="19" font-weight="bold" fill="#0A1A3A">POLYVORTEX — the N-vortex extension bench (mini-repository)</text>

  <rect x="30" y="60" width="200" height="120" rx="8" fill="#F4F6FA" stroke="#2E5FA3" stroke-width="1.4"/>
  <text x="130" y="86" text-anchor="middle" font-family="Liberation Sans, Arial" font-size="13" font-weight="bold" fill="#0A1A3A">Inputs</text>
  <text x="130" y="108" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="12" fill="#0A1A3A">N, Γ, R — the ring</text>
  <text x="130" y="128" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="12" fill="#0A1A3A">C_Ch, T — the gauge pair</text>
  <text x="130" y="148" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="12" fill="#0A1A3A">q_k — topological charges</text>
  <text x="130" y="168" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="11" fill="#2E5FA3">presets: quick / default / full</text>

  <rect x="330" y="52" width="280" height="66" rx="8" fill="#FFFFFF" stroke="#2E5FA3" stroke-width="1.4"/>
  <text x="470" y="76" text-anchor="middle" font-family="Liberation Sans, Arial" font-size="13" font-weight="bold" fill="#0A1A3A">Layer K — model.py</text>
  <text x="470" y="98" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="11.5" fill="#0A1A3A">Kirchhoff RHS · RK4 · H, P, Q, I · Jacobian</text>

  <rect x="330" y="128" width="280" height="62" rx="8" fill="#FFFFFF" stroke="#2E5FA3" stroke-width="1.4"/>
  <text x="470" y="151" text-anchor="middle" font-family="Liberation Sans, Arial" font-size="13" font-weight="bold" fill="#0A1A3A">Layer G — ansatz.py · classical.py</text>
  <text x="470" y="173" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="11.5" fill="#0A1A3A">closed form (H1) · ω_N · chords · unwrap</text>

  <rect x="660" y="60" width="250" height="120" rx="8" fill="#F4F6FA" stroke="#2E5FA3" stroke-width="1.4"/>
  <text x="785" y="86" text-anchor="middle" font-family="Liberation Sans, Arial" font-size="13" font-weight="bold" fill="#0A1A3A">W-ladder — ladder.py</text>
  <text x="785" y="107" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="11.5" fill="#0A1A3A">W1 anchor · W2 rotation · W3 invariants</text>
  <text x="785" y="126" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="11.5" fill="#0A1A3A">W4 stability · W5 admissibility</text>
  <text x="785" y="145" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="11.5" fill="#0A1A3A">W6 obstruction · W7 bridge (D1)</text>
  <text x="785" y="166" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="11" fill="#2E5FA3">tolerances: 1e-12 … 1e-6</text>

  <rect x="240" y="230" width="460" height="64" rx="8" fill="#FFFFFF" stroke="#0A1A3A" stroke-width="1.6"/>
  <text x="470" y="254" text-anchor="middle" font-family="Liberation Sans, Arial" font-size="13" font-weight="bold" fill="#0A1A3A">results/protocols/W1..W7_*.json — committed, deterministic</text>
  <text x="470" y="276" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="11.5" fill="#0A1A3A">"every number is bound to a run" — re-derived by the 26-test guard</text>

  <rect x="60" y="330" width="380" height="100" rx="8" fill="#F4F6FA" stroke="#2E5FA3" stroke-width="1.4"/>
  <text x="250" y="356" text-anchor="middle" font-family="Liberation Sans, Arial" font-size="13" font-weight="bold" fill="#0A1A3A">figures/ — this module</text>
  <text x="250" y="378" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="11.5" fill="#0A1A3A">fig01 two layers · fig02 rotation · fig03 stability</text>
  <text x="250" y="397" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="11.5" fill="#0A1A3A">fig04 admissibility + D1 · scheme_polyvortex.svg</text>
  <text x="250" y="416" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="11" fill="#2E5FA3">300 dpi PNG, bound to the protocols</text>

  <rect x="500" y="330" width="380" height="100" rx="8" fill="#F4F6FA" stroke="#2E5FA3" stroke-width="1.4"/>
  <text x="690" y="356" text-anchor="middle" font-family="Liberation Sans, Arial" font-size="13" font-weight="bold" fill="#0A1A3A">docs/ — the publication stack</text>
  <text x="690" y="378" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="11.5" fill="#0A1A3A">monograph/ (RU+EN, md+docx+pdf) — the big monograph</text>
  <text x="690" y="397" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="11.5" fill="#0A1A3A">monographs/ — Theorems A, B, E · Lemmas C, D (RU+EN)</text>
  <text x="690" y="416" text-anchor="middle" font-family="Liberation Serif, Georgia" font-size="11" fill="#2E5FA3">Theorems B, C-proof, D-proof feed TB1–TW5 / T1, T3, T5</text>

  <line x1="230" y1="120" x2="322" y2="90" stroke="#0A1A3A" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="230" y1="130" x2="322" y2="155" stroke="#0A1A3A" stroke-width="1.3" marker-end="url(#arr)"/>
