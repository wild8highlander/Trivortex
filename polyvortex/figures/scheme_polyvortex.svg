  <line x1="785" y1="180" x2="700" y2="228" stroke="#0A1A3A" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="470" y1="116" x2="470" y2="126" stroke="#0A1A3A" stroke-width="0"/>
  <line x1="380" y1="294" x2="250" y2="326" stroke="#0A1A3A" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="560" y1="294" x2="690" y2="326" stroke="#0A1A3A" stroke-width="1.3" marker-end="url(#arr)"/>
</svg>
