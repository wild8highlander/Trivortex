<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="TRIVORTEX logo — three intertwined vortex rings">
  <defs>
    <radialGradient id="disc" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#16305E"/>
      <stop offset="0.65" stop-color="#0E2145"/>
      <stop offset="1" stop-color="#0A1730"/>
    </radialGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D878"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#A8842B"/>
    </linearGradient>
    <linearGradient id="gold2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C96A"/>
      <stop offset="1" stop-color="#C09A32"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8F6F24"/>
    </linearGradient>
  </defs>

  <!-- badge disc -->
  <circle cx="120" cy="120" r="116" fill="url(#disc)"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#D4AF37" stroke-width="2.4" opacity="0.9"/>
  <circle cx="120" cy="120" r="109" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.45"/>

  <!-- starfield -->
  <circle cx="60" cy="52" r="1.1" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="176" cy="44" r="0.9" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="206" cy="96" r="1.2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="42" cy="150" r="0.9" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="80" cy="206" r="1.1" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="186" cy="186" r="0.9" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="150" cy="30" r="0.7" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="28" cy="88" r="0.7" fill="#FFFFFF" opacity="0.35"/>

  <!-- the three intertwined vortex rings (trefoil of tori) -->
  <!-- ring A: top-left, ring B: top-right, ring C: bottom -->
  <circle cx="94" cy="98" r="56" fill="none" stroke="url(#gold1)" stroke-width="9" stroke-opacity="0.95"/>
  <circle cx="146" cy="98" r="56" fill="none" stroke="url(#gold2)" stroke-width="9" stroke-opacity="0.95"/>
  <circle cx="120" cy="140" r="56" fill="none" stroke="url(#gold3)" stroke-width="9" stroke-opacity="0.95"/>

  <!-- weave: short navy gaps that let each ring pass "under" the next -->
  <circle cx="94" cy="98" r="56" fill="none" stroke="#0E2145" stroke-width="12"
          stroke-dasharray="10 341.6" stroke-dashoffset="-96" stroke-linecap="butt"/>
  <circle cx="146" cy="98" r="56" fill="none" stroke="#0E2145" stroke-width="12"
          stroke-dasharray="10 341.6" stroke-dashoffset="-140" stroke-linecap="butt"/>
  <circle cx="120" cy="140" r="56" fill="none" stroke="#0E2145" stroke-width="12"
          stroke-dasharray="10 341.6" stroke-dashoffset="-52" stroke-linecap="butt"/>

  <!-- vortex heads: a dot and a swirl tick on each ring, clockwise spin -->
  <g fill="#FFFFFF">
    <circle cx="94" cy="42.5" r="4.6"/>
    <circle cx="202" cy="98" r="4.6" transform="rotate(0)" fill="#F5E6B0"/>
    <circle cx="120" cy="195.5" r="4.6" fill="#F5E6B0"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
    <path d="M 100 39 A 8 8 0 0 1 108 45"/>
    <path d="M 196 104 A 8 8 0 0 1 199 112" transform="rotate(-8 202 98)"/>
    <path d="M 108 193 A 8 8 0 0 1 114 199" transform="rotate(10 120 195.5)"/>
  </g>

  <!-- the triangle of centers: the Lagrange skeleton binding the three rings -->
  <path d="M 94 98 L 146 98 L 120 140 Z" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity="0.55"/>
  <circle cx="94" cy="98" r="1.9" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="146" cy="98" r="1.9" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="120" cy="140" r="1.9" fill="#FFFFFF" opacity="0.9"/>
</svg>
