---
# Pre-commit hooks — Automated code quality on every commit
# https://pre-commit.com
repos:
  # ─── General quality ───
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: pretty-format-json
        args: [--autofix, --indent=2]
      - id: requirements-txt-fixer
      - id: sort-simple-yaml

  # ─── Python: Black (code formatting) ───
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.12
        args: [--config, pyproject.toml]

  # ─── Python: Ruff (linting) ───
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix, --show-fixes]
      - id: ruff-format

  # ─── Python: isort (import sorting) ───
  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: [--profile, black]

  # ─── Spelling ───
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.0
    hooks:
      - id: codespell
        args: [--ignore-words-list, "nse,kdv,bkm,gui,gue,hilbert,ab-cloud,theta,langlands,polya"]
        additional_dependencies: [tomli]

  # ─── Markdown ───
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
        exclude: CHANGELOG.md

  # ─── Security ───
  - repo: https://github.com/PyCQA/bandit
    rev: 1.10.0
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ['bandit[toml]']

  # ─── YAML ───
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [--config-file, .yamllint.yml]

  # ─── Conventional commits ───
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, math, proof, verify, docs, ci, build, refactor, test, perf, style, revert, chore]

  # ─── CFF validation ───
  - repo: https://github.com/citation-file-format/cffconvert-pre-commit
    rev: v2.0.0
    hooks:
      - id: validate-cff

  # ─── Notebook ───
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-black
      - id: nbqa-ruff
