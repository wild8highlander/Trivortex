# Release Drafter Configuration
# https://github.com/release-drafter/release-drafter
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
cut-off-after: '---'  # Cut off changelog at this marker if present

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '🧮 Mathematics'
    labels:
      - 'mathematics'
      - 'proof'
      - 'theorem'
  - title: '✅ Formal Verification'
    labels:
      - 'formal-verification'
      - 'lean4'
      - 'coq'
      - 'isabelle'
      - 'agda'
  - title: '🔬 Numerical Verification'
    labels:
      - 'numerical-verification'
      - 'python'
      - 'julia'
      - 'rust'
  - title: '📖 Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: '🔧 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'ci'
  - title: '🔒 Security'
    labels:
      - 'security'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'  # Escape special characters in titles

version-resolver:
  major:
    labels: ['major', 'breaking']
  minor:
    labels: ['minor', 'feature', 'enhancement']
  patch:
    labels: ['patch', 'bug', 'fix', 'security']
  default: patch

template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  ---

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
