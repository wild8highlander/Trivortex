---
# OpenSSF Scorecard — Security posture assessment
# https://securityscorecards.dev
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday at 00:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Update Scorecard Badge
        run: |
          SCORE=$(jq '.checks | map(.score) | add / length' results.sarif 2>/dev/null || echo "0")
          if [ "$SCORE" -ge 8 ]; then COLOR="brightgreen";
          elif [ "$SCORE" -ge 6 ]; then COLOR="green";
          elif [ "$SCORE" -ge 4 ]; then COLOR="yellow";
          else COLOR="red"; fi
          cat > .github/badges/scorecard-badge.json << EOF
          {
            "schemaVersion": 1,
            "label": "OpenSSF Score",
            "message": "${SCORE}/10",
            "color": "${COLOR}"
          }
          EOF

      - name: Commit Badge Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/scorecard-badge.json
          git diff --staged --quiet || git commit -m "ci: update scorecard badge"
          git push
