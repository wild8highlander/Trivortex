---
name: TRIVORTEX CI

# The repository pipeline for the TRIVORTEX document:
#   1. syntax-check every Python file (code/ + verification/ + research/
#      + cycloring/python + polyvortex/python);
#   2. run the independent verification ladder V1-V4 (quick preset);
#   3. run the W1-W7 + P1-P7 + X1-X6 + V1-V2 ladders of the three mini-research
#      programs (cycloring, polyvortex, planetvortex, quick preset);
#   4. run the pytest guard (63 verification tests + 37 cycloring + 26 polyvortex +
#      80 planetvortex).
# A green run is what the CI badge in the root README reflects.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivortex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    name: Syntax check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile every Python file
        run: |
          python - <<'PY'
          import py_compile, os, sys
          roots = ["code", "verification", "research", "cycloring/python", "polyvortex/python", "planetvortex/python"]
          errors = []
          for root in roots:
              for dirpath, _dirs, files in os.walk(root):
                  if "outputs" in dirpath.split(os.sep):
                      continue
                  for f in files:
                      if f.endswith(".py"):
                          path = os.path.join(dirpath, f)
                          try:
                              py_compile.compile(path, doraise=True)
                          except py_compile.PyCompileError as e:
                              errors.append(str(e))
          if errors:
              for e in errors:
                  print(e)
              sys.exit(1)
          print("All Python files passed syntax check")
          PY

  verification-ladder:
    name: Verification ladder V1–V4 (quick)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install numpy
        run: pip install numpy
      - name: Run the ladder
        run: |
          python3 verification/trivortex/python/verify.py --preset quick \
            --out-dir verification/outputs/trivortex
      - name: Upload JSON protocol
        uses: actions/upload-artifact@v7
        with:
          name: trivortex-verify-protocol
          path: verification/outputs/trivortex/*.json
          if-no-files-found: error
          retention-days: 30

  mini-program-ladders:
    name: Mini-program ladders W1–W7 + P1–P7 (quick)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install numpy mpmath
      - name: CYCLORING — the W-ladder (quick)
        run: |
          cd cycloring
          PYTHONPATH=python python3 python/cycloring/runner.py --preset quick
      - name: POLYVORTEX — the W-ladder (quick)
        run: |
          cd polyvortex
          PYTHONPATH=python python3 python/polyvortex/runner.py --preset quick
      - name: PLANETVORTEX — the P-ladder, the X-register and the V-register (quick)
        run: |
          cd planetvortex
          PYTHONPATH=python python3 python/planetvortex/runner.py --suite all --preset quick
      - name: PLANETVORTEX — the cross-language oracle (C99 vs Python)
        run: |
          cd planetvortex
          make -C c clean run > /dev/null
          PYTHONPATH=python python3 tools/crosslang_diff.py
      - name: Upload the mini-program protocols
        uses: actions/upload-artifact@v7
        with:
          name: mini-program-protocols
          path: |
            cycloring/results/protocols/*.json
            polyvortex/results/protocols/*.json
            planetvortex/results/protocols/*.json
          if-no-files-found: error
          retention-days: 30

  pytest-guard:
    name: Pytest guard (reference values)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        # Pinned: the reference-value gate must be reproducible — a floating
        # numpy/scipy/pytest release must not move the anchors, the §8
        # spectrum or the §10 bifurcation roots under the tolerance bands by
        # surprise. Same policy as the lint gate's pinned ruff/black: bump
        # deliberately, after `make test` is green on the new set locally.
        # This exact set is verified green on all five suites (220 tests).
        run: |
          python -V
          pip install numpy==2.5.5 scipy==1.18.1 mpmath==1.4.1 pytest==9.2.0
      - name: The verification suite
        run: |
          python -m pytest verification/tests/ -v --tb=long -ra 2>&1 | tee /tmp/gate_verification.log
          code=${PIPESTATUS[0]}
          [ "$code" -eq 0 ] || bash .github/scripts/gate_dump.sh \
            /tmp/gate_verification.log "The verification suite"
          exit "$code"
      - name: >-
          The MASTER regression suite (14 tests — Lagrange anchors, the §8
          spectrum and the §10 bifurcations, all against the Lean-exported bridge)
        # --tb=long -ra plus gate_dump.sh: if a reference assertion ever
        # drifts, the public job summary localizes it (value, band, file)
        # without a second run — the raw log is behind a sign-in wall.
        run: |
          python -m pytest verification/trivortex_master/tests/ -v --tb=long -ra 2>&1 | tee /tmp/gate_master.log
          code=${PIPESTATUS[0]}
          [ "$code" -eq 0 ] || bash .github/scripts/gate_dump.sh \
            /tmp/gate_master.log "The MASTER regression suite"
          exit "$code"
      - name: The cycloring guard (37 tests)
        run: |
          python -m pytest cycloring/tests/ -v --tb=long -ra 2>&1 | tee /tmp/gate_cycloring.log
          code=${PIPESTATUS[0]}
          [ "$code" -eq 0 ] || bash .github/scripts/gate_dump.sh \
            /tmp/gate_cycloring.log "The cycloring guard"
          exit "$code"
      - name: The polyvortex guard (26 tests)
        run: |
          python -m pytest polyvortex/tests/ -v --tb=long -ra 2>&1 | tee /tmp/gate_polyvortex.log
          code=${PIPESTATUS[0]}
          [ "$code" -eq 0 ] || bash .github/scripts/gate_dump.sh \
            /tmp/gate_polyvortex.log "The polyvortex guard"
          exit "$code"
      - name: The planetvortex guard (80 tests)
        run: |
          python -m pytest planetvortex/tests/ -v --tb=long -ra 2>&1 | tee /tmp/gate_planetvortex.log
          code=${PIPESTATUS[0]}
          [ "$code" -eq 0 ] || bash .github/scripts/gate_dump.sh \
            /tmp/gate_planetvortex.log "The planetvortex guard"
          exit "$code"
