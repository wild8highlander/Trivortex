---
# Stale — Close inactive issues and PRs after a period of inactivity
# https://github.com/actions/stale
name: Stale

on:
  schedule:
    - cron: '30 1 * * *'  # Daily at 01:30 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 90
          days-before-close: 14
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,mathematics,proof'
          exempt-pr-labels: 'pinned,security,formal-verification'

          stale-issue-message: |
            👋 This issue has been automatically marked as stale because it has not had
            any activity for 90 days. It will be closed in 14 days if no further activity occurs.
            If this issue is still relevant, please add a comment or remove the `stale` label.

          stale-pr-message: |
            👋 This pull request has been automatically marked as stale because it has not had
            any activity for 90 days. It will be closed in 14 days if no further activity occurs.
            If this PR is still being worked on, please add a comment or remove the `stale` label.

          close-issue-message: |
            🔒 This issue has been closed due to inactivity. If you believe this is still
            relevant, please reopen it with an updated description.

          close-pr-message: |
            🔒 This pull request has been closed due to inactivity. If you're still
            working on this, please reopen it.

          days-before-pr-close: 14
          delete-branch: true
          operations-per-run: 30
