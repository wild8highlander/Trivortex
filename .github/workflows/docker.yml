---
name: Docker Build

on:
  push:
    branches: [main]
    paths: ['verification/docker/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [agda, coq, cpp, haskell, isabelle, lean4, rust]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        run: |
          cd verification
          docker build -t rpv-${{ matrix.service }} -f docker/${{ matrix.service }}/Dockerfile . || true
