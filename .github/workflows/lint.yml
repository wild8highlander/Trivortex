---
# Lint — Code and documentation quality checks
# markdownlint, yamllint, ruff, black, mypy
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint.json
          globs: |
            **/*.md
            !CHANGELOG.md

  yaml-lint:
    name: YAML
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML
        run: yamllint -c .yamllint.yml .github/workflows/ .pre-commit-config.yaml environment.yml CITATION.cff

  python-lint:
    name: Python (ruff + black + mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install linting tools
        run: pip install ruff black mypy

      - name: Ruff check
        run: ruff check . --output-format=github

      - name: Black check
        run: black --check .

      - name: Type check with mypy
        run: |
          mypy verification/common/python verification/trivortex/python \
            --ignore-missing-imports --no-error-summary || true

  citation-lint:
    name: CITATION.cff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate CITATION.cff
        uses: dieghernan/cff-validator@v5
