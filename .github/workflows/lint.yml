---
# Lint — Code and documentation quality checks
# markdownlint, yamllint, ruff, black, mypy
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint.json
          # literature.md is excluded: it is a parser-consumed DATA file
          # (reports/bibliography.py reads "N. **..." lines) — its citation
          # numbering is semantic, not a markdown list convention.
          globs: |
            **/*.md
            !CHANGELOG.md
            !verification/trivortex_master/data/literature.md

  yaml-lint:
    name: YAML
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install yamllint
        run: pip install yamllint==1.38.0
      - name: Lint YAML
        run: yamllint -c .yamllint.yml .github/workflows/ .pre-commit-config.yaml environment.yml CITATION.cff

  python-lint:
    name: Python (ruff + black + mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install linting tools
        # Pinned: the lint gate must be reproducible — rule drift in floating
        # ruff/black releases must not break CI by surprise. Bump deliberately.
        run: pip install ruff==0.17.6 black==26.10.1 mypy

      - name: Ruff check
        run: ruff check . --output-format=github

      - name: Black check
        run: black --check .

      - name: Type check with mypy
        run: |
          mypy verification/common/python verification/trivortex/python \
            polyvortex/python/polyvortex \
            cycloring/python/cycloring \
            --ignore-missing-imports --no-error-summary || true

  citation-lint:
    name: CITATION.cff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate CITATION.cff
        uses: dieghernan/cff-validator@v5
