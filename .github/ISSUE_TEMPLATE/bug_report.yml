name: Bug Report
description: Report a bug, incorrect result, or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill in the details below.

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What type of bug is this?
      options:
        - Formal/ported verification error
        - Verification ladder discrepancy (V1–V4)
        - Numerical computation error
        - Build/compilation error
        - CI/CD failure
        - Documentation error
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: "When running verification X, the result Y was expected but Z was obtained..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the issue
      placeholder: |
        1. Clone the repository
        2. Run `make verify-all`
        3. Observe error in verification/python/nse_check.py
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version/commit are you using?
      placeholder: "v1.3.0 or commit abc1234"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      placeholder: |
        - OS: Ubuntu 22.04
        - Python: 3.12.4
        - Lean: 4.14.0
        - NumPy: 1.26.4

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, logs, or screenshots
