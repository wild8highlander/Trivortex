<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A1730"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4AF37"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#FFFFFF"/>
  <text x="30" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0A1730">TRX-04 &#8212; Scheme: photon fluid &#8212; three Kerr solitons</text>
  <text x="30" y="63" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3A4A66">Light in a focusing Kerr medium behaves as a fluid of photons: in-phase spatial solitons attract, anti-phase solitons repel</text>
  <rect x="70" y="92" width="350" height="308" rx="10" fill="#FBF6E8" stroke="#0A1730" stroke-width="2"/>
  <text x="245" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0A1730" text-anchor="middle">focusing Kerr medium &#8212; top view</text>
  <text x="245" y="418" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A4A66" text-anchor="middle">beams propagate along z (out of the page)</text>
  <line x1="245" y1="170" x2="172" y2="298" stroke="#0A1730" stroke-width="1.7"/>
  <line x1="172" y1="298" x2="318" y2="298" stroke="#0A1730" stroke-width="1.7"/>
  <line x1="318" y1="298" x2="245" y2="170" stroke="#0A1730" stroke-width="1.7"/>
  <line x1="245" y1="255" x2="245" y2="170" stroke="#0A1730" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <line x1="239" y1="255" x2="251" y2="255" stroke="#0A1730" stroke-width="1.4"/>
  <line x1="245" y1="249" x2="245" y2="261" stroke="#0A1730" stroke-width="1.4"/>
  <text x="252" y="212" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0A1730">r_c = a/&#8730;3</text>
  <path d="M 321 179 A 108 108 0 0 0 169 179" fill="none" stroke="#0A1730" stroke-width="1.8" marker-end="url(#arrN)"/>
  <text x="245" y="132" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0A1730" text-anchor="middle">&#969; = 0.2231</text>
  <line x1="263" y1="202" x2="303" y2="272" stroke="#D4AF37" stroke-width="1.8" marker-end="url(#arrG)"/>
  <line x1="227" y1="202" x2="187" y2="272" stroke="#D4AF37" stroke-width="1.8" marker-end="url(#arrG)"/>
  <circle cx="245" cy="170" r="15" fill="#D4AF37" fill-opacity="0.22" stroke="#0A1730" stroke-width="1.5"/>
  <circle cx="245" cy="170" r="9" fill="#D4AF37" fill-opacity="0.5" stroke="none"/>
  <circle cx="245" cy="170" r="4" fill="#D4AF37" stroke="#0A1730" stroke-width="1.2"/>
  <circle cx="172" cy="298" r="15" fill="#D4AF37" fill-opacity="0.22" stroke="#0A1730" stroke-width="1.5"/>
  <circle cx="172" cy="298" r="9" fill="#D4AF37" fill-opacity="0.5" stroke="none"/>
  <circle cx="172" cy="298" r="4" fill="#D4AF37" stroke="#0A1730" stroke-width="1.2"/>
  <circle cx="318" cy="298" r="15" fill="#D4AF37" fill-opacity="0.22" stroke="#0A1730" stroke-width="1.5"/>
  <circle cx="318" cy="298" r="9" fill="#D4AF37" fill-opacity="0.5" stroke="none"/>
  <circle cx="318" cy="298" r="4" fill="#D4AF37" stroke="#0A1730" stroke-width="1.2"/>
  <text x="278" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0A1730">beam 1</text>
  <text x="172" y="332" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0A1730" text-anchor="middle">beam 2</text>
  <text x="318" y="332" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0A1730" text-anchor="middle">beam 3</text>
  <text x="296" y="222" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0A1730">a = 3</text>
  <text x="245" y="368" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0A1730" text-anchor="middle">in-phase triplet: rigidly rotating</text>
  <text x="245" y="386" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0A1730" text-anchor="middle">Lagrange beam triangle (optical)</text>
  <line x1="520" y1="330" x2="925" y2="330" stroke="#0A1730" stroke-width="1.5" marker-end="url(#arrN)"/>
  <line x1="535" y1="355" x2="535" y2="115" stroke="#0A1730" stroke-width="1.5" marker-end="url(#arrN)"/>
  <text x="925" y="348" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0A1730" text-anchor="end">beam separation r [w]</text>
  <text x="548" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0A1730" text-anchor="end">pair energy V(r)</text>
  <line x1="631" y1="330" x2="631" y2="335" stroke="#0A1730" stroke-width="1"/>
  <line x1="727" y1="330" x2="727" y2="335" stroke="#0A1730" stroke-width="1"/>
  <line x1="823" y1="330" x2="823" y2="335" stroke="#0A1730" stroke-width="1"/>
  <text x="631" y="348" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A4A66" text-anchor="middle">2</text>
  <text x="727" y="348" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A4A66" text-anchor="middle">4</text>
  <text x="823" y="348" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A4A66" text-anchor="middle">6</text>
  <line x1="535" y1="245" x2="920" y2="245" stroke="#0A1730" stroke-width="0.9" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="920" y="239" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A4A66" text-anchor="end">V = 0 (free beams)</text>
  <path d="M 535 355 C 555 320 565 300 583 294 C 605 277 615 272 631 270 C 655 261 665 255 679 250.5 C 700 247.5 715 247 727 247 C 760 245.8 800 245.3 920 245.2" fill="none" stroke="#D4AF37" stroke-width="2.2"/>
  <text x="618" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0A1730">in phase: attraction</text>
  <text x="618" y="327" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A4A66">V = &#8722;U&#183;exp(&#8722;r/w)</text>
  <path d="M 535 135 C 555 170 565 195 583 204 C 605 222 615 227 631 230 C 655 235 665 238 679 239.5 C 700 242 715 242.5 727 243 C 760 244 800 244.7 920 244.9" fill="none" stroke="#C44E52" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="618" y="172" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#C44E52">anti-phase: repulsion</text>
  <text x="618" y="187" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#C44E52">V = +U&#183;exp(&#8722;r/w)</text>
  <line x1="679" y1="330" x2="679" y2="205" stroke="#0A1730" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>
  <circle cx="679" cy="250.5" r="5" fill="#D4AF37" stroke="#0A1730" stroke-width="1.5"/>
  <text x="688" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0A1730">operating point a = 3:</text>
  <text x="688" y="288" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A4A66">force (U/w)&#183;exp(&#8722;3) = 0.0498</text>
  <text x="688" y="303" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A4A66">supplies the centripetal balance m&#969;&#178;r_c</text>
  <rect x="700" y="78" width="222" height="58" rx="6" fill="#FFFFFF" stroke="#0A1730" stroke-width="1.4"/>
  <text x="712" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0A1730">rigid rotation (Lagrange analog)</text>
  <text x="712" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0A1730">&#969;&#178; = 3U exp(&#8722;a/w)/(m a w) = 0.0498</text>
  <rect x="560" y="398" width="364" height="58" rx="6" fill="#FBF6E8" stroke="#0A1730" stroke-width="1.4"/>
  <text x="574" y="420" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0A1730">in-phase pair (binary)</text>
  <text x="574" y="440" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0A1730">bound while v_b &lt; &#8730;(U&#183;exp(&#8722;r_c/w)) = 0.2231;  preset v_b = 0.15:</text>
  <text x="574" y="454" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A4A66">precessing bound orbit, separation within [0.63, 4.79]</text>
  <text x="30" y="524" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6B7A94">TRIVORTEX Research Program &#183; study TRX-04 &#183; the beam triangle is the optical sibling of the Lagrange solution (Theorem 3.1)</text>
</svg>