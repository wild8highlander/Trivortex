<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A1730"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4AF37"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#FFFFFF"/>
  <text x="30" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0A1730">TRX-12 &#8212; Scheme: laser highway &#8212; light-sail stationkeeping at L4</text>
  <text x="30" y="63" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3A4A66">A photon beam from Earth pushes a light sail; a PD beam-steering law points the photon thrust a&#8342; = 2P/(cm) and holds the sail at L4</text>
  <line x1="280" y1="360" x2="500" y2="130" stroke="#0A1730" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.5"/>
  <line x1="720" y1="360" x2="500" y2="130" stroke="#0A1730" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.5"/>
  <line x1="280" y1="360" x2="720" y2="360" stroke="#0A1730" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="500" y="384" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3A4A66" text-anchor="middle">equilateral configuration, side = LU = 3.844&#183;10&#8312; m</text>
  <circle cx="280" cy="360" r="34" fill="#D4AF37" stroke="#0A1730" stroke-width="2"/>
  <circle cx="720" cy="360" r="12" fill="#0A1730" stroke="#0A1730" stroke-width="2"/>
  <line x1="285" y1="356" x2="292" y2="363" stroke="#0A1730" stroke-width="1.4"/>
  <line x1="292" y1="356" x2="285" y2="363" stroke="#0A1730" stroke-width="1.4"/>
  <line x1="296" y1="368" x2="332" y2="398" stroke="#0A1730" stroke-width="0.8" opacity="0.6"/>
  <text x="336" y="402" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A4A66">barycentre (origin of the rotating frame)</text>
  <text x="280" y="418" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0A1730" text-anchor="middle">Earth &#183; laser site</text>
  <text x="280" y="435" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3A4A66" text-anchor="middle">P = 1 MW transmitter</text>
  <text x="720" y="418" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0A1730" text-anchor="middle">Moon &#183; m&#8322; = &#956;</text>
  <text x="720" y="435" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3A4A66" text-anchor="middle">&#956; = 0.0121505856</text>
  <rect x="296" y="316" width="26" height="12" rx="2" fill="#FFFFFF" stroke="#0A1730" stroke-width="1.8" transform="rotate(-42 309 322)"/>
  <polygon points="308,314 486,146 502,162 316,330" fill="#D4AF37" opacity="0.22"/>
  <line x1="310" y1="316" x2="497" y2="153" stroke="#D4AF37" stroke-width="2.2" marker-end="url(#arrG)"/>
  <text x="318" y="296" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0A1730">photon beam, thrust 2P/(cm) along the beam axis</text>
  <circle cx="500" cy="130" r="46" fill="none" stroke="#0A1730" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/>
  <circle cx="500" cy="130" r="6" fill="#FFFFFF" stroke="#0A1730" stroke-width="1.8"/>
  <text x="452" y="106" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0A1730" text-anchor="end">L&#8324;</text>
  <text x="452" y="122" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A4A66" text-anchor="end">libration halo (free drift)</text>
  <path d="M 520 106 A 30 22 -25 1 1 527 141" fill="none" stroke="#D4AF37" stroke-width="1.8" marker-end="url(#arrG)"/>
  <rect x="524" y="108" width="16" height="16" rx="2" fill="#D4AF37" stroke="#0A1730" stroke-width="1.8" transform="rotate(20 532 116)"/>
  <text x="562" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0A1730">light sail (m = 10 kg)</text>
  <text x="562" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A4A66">held to |r &#8722; L&#8324;| &#8776; 7.5&#183;10&#8315;&#8311;</text>
  <rect x="648" y="196" width="276" height="86" rx="6" fill="#FFFFFF" stroke="#0A1730" stroke-width="1.8"/>
  <text x="662" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0A1730">Feedback control loop</text>
  <text x="662" y="242" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0A1730">u = &#8722;K&#8342;(r &#8722; r&#8342;&#8324;) &#8722; K&#8345;v</text>
  <text x="662" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A4A66">beam steering points the thrust;</text>
  <text x="662" y="277" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A4A66">|a&#8342;| &#8804; a&#8343;&#8344;&#8339; = 2P/(cm) = 0.2443</text>
  <path d="M 540 128 C 610 150 640 172 700 194" fill="none" stroke="#0A1730" stroke-width="1.4" marker-end="url(#arrN)"/>
  <text x="560" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A4A66">sail state (r, v)</text>
  <path d="M 700 240 C 560 250 470 240 340 306" fill="none" stroke="#0A1730" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrN)" opacity="0.75"/>
  <text x="470" y="252" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A4A66">steering command</text>
  <text x="96" y="480" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0A1730">Orbit raising: thrust along velocity gives &#268;&#8342; = &#8722;2a&#8342;&#183;v &#8804; 0 &#8212; the Jacobi constant C&#8342; = 2&#937; &#8722; v&#178; is pumped down</text>
  <text x="96" y="498" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3A4A66">between invariant manifolds: the laser highway operates by moving C&#8342;, not by fighting gravity</text>
  <text x="30" y="524" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6B7A94">TRIVORTEX Research Program &#183; study TRX-12 &#183; laser light-sail stationkeeping at L4/L5, Earth&#8211;Moon CR3BP</text>
</svg>