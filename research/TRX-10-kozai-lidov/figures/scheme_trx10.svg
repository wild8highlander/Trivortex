<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A1730"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4AF37"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#FFFFFF"/>
  <text x="30" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0A1730">TRX-10 &#8212; Scheme: Kozai&#8211;Lidov exchange in a hierarchical triple</text>
  <text x="30" y="63" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3A4A66">A distant inclined companion drives eccentricity&#8211;inclination oscillations; j_z = &#8730;(1&#8722;e&#178;)&#183;cos i stays constant</text>
  <text x="30" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0A1730">Hierarchical triple (inner orbit inclined by i&#8320; = 60&#176;)</text>
  <rect x="28" y="112" width="190" height="56" rx="6" fill="#FFFFFF" stroke="#0A1730" stroke-width="1.4"/>
  <text x="40" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0A1730">KL clock: t_KL ~ 1/C&#8322;</text>
  <text x="40" y="149" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0A1730">C&#8322; = (3/8)(m&#8323;/M)(a_in/a_out)&#179;n_in</text>
  <text x="40" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A4A66">period halves when m&#8323; doubles</text>
  <circle cx="215" cy="300" r="128" fill="none" stroke="#0A1730" stroke-width="1.8" stroke-dasharray="7 5"/>
  <circle cx="279" cy="189.2" r="9" fill="#0A1730" stroke="#0A1730" stroke-width="1.5"/>
  <text x="291" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0A1730">outer companion (m&#8323;, circular orbit)</text>
  <text x="291" y="197" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A4A66">a_out = 20 a_in in the run &#8212; drawn not to scale</text>
  <ellipse cx="144.5" cy="321.4" rx="92" ry="50" fill="none" stroke="#D4AF37" stroke-width="2.2" transform="rotate(-24 144.5 321.4)"/>
  <circle cx="215" cy="290" r="12" fill="#D4AF37" stroke="#0A1730" stroke-width="2"/>
  <circle cx="189.5" cy="262.7" r="5.5" fill="#0A1730"/>
  <line x1="183" y1="257" x2="70" y2="205" stroke="#0A1730" stroke-width="0.9" opacity="0.6"/>
  <text x="30" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0A1730">test particle</text>
  <text x="30" y="208" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A4A66">e: 0.001 &#8594; 0.764 each cycle</text>
  <line x1="108" y1="242" x2="200" y2="281" stroke="#0A1730" stroke-width="0.8" opacity="0.6"/>
  <text x="30" y="234" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0A1730">inner primary</text>
  <text x="30" y="250" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A4A66">GM_inner = 1, a_in = 1</text>
  <text x="30" y="448" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A4A66">gold ellipse: inner orbit at e_max = 0.7638 (i&#8320; = 60&#176;)</text>
  <text x="500" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0A1730">Inclination &#8596; eccentricity ledger</text>
  <line x1="800" y1="380" x2="800" y2="130" stroke="#0A1730" stroke-width="2" marker-end="url(#arrN)"/>
  <text x="812" y="140" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0A1730">h&#8323; (outer orbit)</text>
  <line x1="800" y1="380" x2="626.8" y2="280" stroke="#D4AF37" stroke-width="2.4" marker-end="url(#arrG)"/>
  <text x="614" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0A1730" text-anchor="end">h (inner orbit)</text>
  <text x="614" y="288" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3A4A66" text-anchor="end">tilted by i&#8320; = 60&#176;</text>
  <path d="M 800 270 A 110 110 0 0 0 704.7 325" fill="none" stroke="#0A1730" stroke-width="1.5"/>
  <text x="812" y="330" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0A1730">i&#8320; = 60&#176; &gt; i_crit</text>
  <line x1="800" y1="380" x2="648.1" y2="194.1" stroke="#C44E52" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="640" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#C44E52" text-anchor="end">i_crit = arccos&#8730;(3/5) = 39.23&#176;</text>
  <text x="640" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#C44E52" text-anchor="end">(Kozai angle &#8212; exchange threshold)</text>
  <rect x="500" y="402" width="230" height="96" rx="6" fill="#FFFFFF" stroke="#0A1730" stroke-width="1.6"/>
  <text x="514" y="424" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0A1730">Conserved (quadrupole, test particle):</text>
  <text x="514" y="446" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0A1730">j_z = &#8730;(1&#8722;e&#178;)&#183;cos i = 0.5</text>
  <text x="514" y="466" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0A1730">at e_max: cos i = &#8730;(3/5) &#8594; i = i_crit</text>
  <text x="514" y="486" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A4A66">e_max = &#8730;(1 &#8722; (5/3)&#183;cos&#178;i&#8320;)</text>
  <line x1="770" y1="488" x2="770" y2="418" stroke="#D4AF37" stroke-width="3" marker-end="url(#arrG)"/>
  <line x1="880" y1="418" x2="880" y2="488" stroke="#0A1730" stroke-width="3" marker-end="url(#arrN)"/>
  <text x="825" y="444" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0A1730" text-anchor="middle">e &#8593; &#183; i &#8595;</text>
  <text x="825" y="464" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0A1730" text-anchor="middle">0.001 &#8594; 0.764</text>
  <text x="825" y="482" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0A1730" text-anchor="middle">60&#176; &#8594; 39.2&#176;</text>
  <text x="30" y="512" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6B7A94">TRIVORTEX Research Program &#183; study TRX-10 &#183; Kozai&#8211;Lidov oscillations in hierarchical triples</text>
  <text x="30" y="528" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6B7A94">Laser link: laser ranging of triple asteroids; LISA-type interferometry of compact-object triples</text>
</svg>