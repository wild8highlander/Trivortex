  <text x="640" y="380" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0A1730">Manley&#8211;Rowe bookkeeping</text>
  <text x="640" y="406" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0A1730">I&#8321; = |a&#8321;|&#178; + |a&#8323;|&#178; = const</text>
  <text x="640" y="426" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0A1730">I&#8322; = |a&#8322;|&#178; + |a&#8323;|&#178; = const</text>
  <text x="640" y="446" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0A1730">I&#8323; = |a&#8321;|&#178; &#8722; |a&#8322;|&#178; = const</text>
  <text x="640" y="468" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A4A66">photon-pair bookkeeping &#8212; the optical twin of</text>
  <text x="640" y="479" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A4A66">vortex circulation bookkeeping (TRIVORTEX)</text>
