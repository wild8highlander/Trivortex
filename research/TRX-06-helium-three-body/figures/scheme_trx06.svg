      <path d="M0,0 L10,5 L0,10 z" fill="#0A1730"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4AF37"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#FFFFFF"/>
  <text x="30" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0A1730">TRX-06 &#8212; Scheme: helium atom as the Coulomb three-body problem</text>
  <text x="30" y="63" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3A4A66">Classical autoionization: the e&#8315;&#8211;e&#8315; repulsion transfers energy &#8212; one electron escapes with several shares of E, its partner is captured</text>
  <rect x="50" y="92" width="400" height="330" rx="10" fill="#FBF6E8" stroke="#0A1730" stroke-width="2"/>
  <text x="250" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0A1730" text-anchor="middle">the atom: two electrons + nucleus (a.u. units)</text>
  <line x1="428" y1="100" x2="428" y2="412" stroke="#0A1730" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.8"/>
  <text x="422" y="398" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0A1730" text-anchor="end">escape sphere</text>
  <text x="422" y="411" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0A1730" text-anchor="end">r = 30 a.u.</text>
  <circle cx="170" cy="270" r="13" fill="#D4AF37" stroke="#0A1730" stroke-width="2"/>
  <text x="170" y="275" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0A1730" text-anchor="middle">+2</text>
  <text x="170" y="305" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0A1730" text-anchor="middle">nucleus, Z = +2</text>
  <line x1="181" y1="258" x2="207" y2="241" stroke="#0A1730" stroke-width="1.4" marker-end="url(#arrN)"/>
  <line x1="179" y1="262" x2="238" y2="286" stroke="#0A1730" stroke-width="1.4" marker-end="url(#arrN)"/>
  <text x="106" y="236" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0A1730">attraction</text>
  <text x="106" y="250" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0A1730">&#8722;Z/r</text>
  <path d="M 236 218 A 44 44 0 1 0 196 254 A 28 28 0 1 0 184 262" fill="none" stroke="#4C72B0" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrN)"/>
  <circle cx="215" cy="235" r="7" fill="#4C72B0" stroke="#0A1730" stroke-width="1.4"/>
  <text x="252" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0A1730">captured e&#8315;</text>
  <text x="252" y="306" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A4A66">E&#8322; &#8776; &#8722;6.3 E (bound)</text>
  <path d="M 205 244 C 250 200, 300 168, 350 150 C 385 138, 408 132, 443 126" fill="none" stroke="#D4AF37" stroke-width="2" marker-end="url(#arrG)"/>
  <circle cx="330" cy="168" r="7" fill="#FFFFFF" stroke="#0A1730" stroke-width="1.6"/>
  <text x="248" y="112" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0A1730">escaping e&#8315;: E&#8321; &#8776; 7.28 E</text>
  <line x1="228" y1="229" x2="318" y2="184" stroke="#0A1730" stroke-width="1.6" marker-start="url(#arrN)" marker-end="url(#arrN)"/>
  <text x="256" y="162" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0A1730" text-anchor="middle">1/r&#8321;&#8322; repulsion &#8212; the</text>
  <text x="256" y="176" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0A1730" text-anchor="middle">energy-transfer channel</text>
  <rect x="500" y="92" width="410" height="150" rx="10" fill="#FFFFFF" stroke="#0A1730" stroke-width="2"/>
  <text x="516" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0A1730">energy ledger of autoionization (measured)</text>
  <circle cx="524" cy="138" r="4.5" fill="#D4AF37"/>
  <text x="538" y="142" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0A1730">launch: excess energy E &#8712; [0.05, 0.3] Ha, shared on the exact shell</text>
  <circle cx="524" cy="163" r="4.5" fill="#D4AF37"/>
  <text x="538" y="167" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0A1730">escaping e&#8315; keeps &#10216;E&#8321;&#10217; = 7.28 E (overshoot &gt; 1)</text>
  <circle cx="524" cy="188" r="4.5" fill="#4C72B0"/>
  <text x="538" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0A1730">captured e&#8315; keeps E&#8322; = E &#8722; E&#8321; &#8776; &#8722;6.3 E (binding released)</text>
  <circle cx="524" cy="213" r="4.5" fill="#FFFFFF" stroke="#0A1730" stroke-width="1.4"/>
  <text x="538" y="217" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0A1730">channel shares: single escape 1.000 &#183; double escape &lt; 10&#8315;&#8308;</text>
  <rect x="500" y="262" width="410" height="130" rx="10" fill="#FBF6E8" stroke="#0A1730" stroke-width="2"/>
  <line x1="522" y1="374" x2="700" y2="374" stroke="#0A1730" stroke-width="1.4"/>
  <line x1="522" y1="374" x2="522" y2="284" stroke="#0A1730" stroke-width="1.4"/>
  <text x="611" y="386" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#3A4A66" text-anchor="middle">log E</text>
  <text x="516" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#3A4A66" text-anchor="end">log P</text>
  <polyline points="540,362 570,362 600,362 630,362 660,362" fill="none" stroke="#D4AF37" stroke-width="2.2"/>
  <circle cx="540" cy="362" r="3.5" fill="#D4AF37"/>
  <circle cx="570" cy="362" r="3.5" fill="#D4AF37"/>
  <circle cx="600" cy="362" r="3.5" fill="#D4AF37"/>
  <circle cx="630" cy="362" r="3.5" fill="#D4AF37"/>
  <circle cx="660" cy="362" r="3.5" fill="#D4AF37"/>
  <line x1="540" y1="358" x2="690" y2="296" stroke="#0A1730" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrN)"/>
  <text x="712" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0A1730">Wannier 1953:</text>
  <text x="712" y="316" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0A1730">P_DE &#8733; E&#7511;,</text>
  <text x="712" y="332" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0A1730">&#945; = 1.056</text>
  <text x="712" y="356" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#3A4A66">gold: this ensemble &#8212;</text>
  <text x="712" y="370" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#3A4A66">strong-coupling</text>
  <text x="712" y="384" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#3A4A66">regime, P_DE &lt; 0.5</text>
  <rect x="500" y="412" width="410" height="108" rx="10" fill="#FBF6E8" stroke="#0A1730" stroke-width="2"/>
  <text x="516" y="431" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0A1730">&#8594; TRIVORTEX mapping</text>
  <text x="516" y="450" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0A1730">Coulomb trio e&#8315;&#8211;e&#8315;&#8211;nucleus &#8594; the three bodies (mixed signs)</text>
  <text x="516" y="469" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0A1730">autoionization overshoot &#8594; energy exchange in choreographies</text>
  <text x="516" y="488" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0A1730">Wannier exponent &#8594; closed-form benchmark (Theorem 3.1 style)</text>
  <text x="516" y="507" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0A1730">softening &#949; = 0.1 a.u. &#8594; finite vortex cores</text>
  <text x="60" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0A1730">H = p&#8321;&#178;/2 + p&#8322;&#178;/2 &#8722; Z/r&#8321; &#8722; Z/r&#8322; + 1/r&#8321;&#8322;   (Z = 2, &#949; = 0.1 a.u.)</text>
  <text x="60" y="470" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3A4A66">CTMC ensemble: N = 3200 trajectories &#183; single-escape fraction 1.000 &#183; &#10216;E&#8321;&#10217; = 7.28 E &#183; max |&#916;E| = 1.714×10⁻⁴ a.u.</text>
  <text x="60" y="492" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3A4A66">launch: staggered Wannier chain R&#8320; = 3, &#916;r &#8712; [0.8, 2.0], transverse kick &#963; = 0.01, exact energy shell</text>
</svg>