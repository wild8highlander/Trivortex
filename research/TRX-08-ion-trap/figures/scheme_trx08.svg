  <text x="60" y="466" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0A1730">a = 3&#185;&#8260;&#179; = 1.442249570 (trap length units); crystal energy U* = (3/2)&#183;3&#178;&#8260;&#179; = 3.120125734578</text>
  <text x="60" y="488" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3A4A66">measured: sides equal to 4.4e-16; angles 2&#960;/3 to 4.4e-16; static hold 3.9e-15 over t = 50; energy drift 8.9e-16</text>
